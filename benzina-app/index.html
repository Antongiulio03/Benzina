:root{
  --bg:#E9ECEE; --surface:#FFFFFF; --fill:#DCE0E3; --ink:#1B1F23; --ink-2:#596169; --ink-3:#848C94;
  --line:#D5D9DD; --hair:rgba(27,31,35,.10);
  --accent:#0F7A45; --accent-ink:#FFFFFF; --accent-soft:rgba(15,122,69,.12);
  --bar:#0F7A45; --bar-dim:#9DC7AE;
  --warn:#9A5B00; --warn-soft:rgba(178,107,0,.12); --danger:#C2361F;
  --lcd:#B9C4A0; --lcd-ink:#16210F; --lcd-ghost:rgba(22,33,15,.085); --lcd-label:#3B4930; --lcd-line:rgba(22,33,15,.16);
  --bezel:#262B2F; --tab:rgba(233,236,238,.86);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121416; --surface:#1C1F22; --fill:#2A2E32; --ink:#ECEEF0; --ink-2:#A4ABB2; --ink-3:#737B83;
    --line:#2E3337; --hair:rgba(236,238,240,.09);
    --accent:#3CBF7B; --accent-ink:#06170D; --accent-soft:rgba(60,191,123,.16);
    --bar:#3CBF7B; --bar-dim:#2D5E44;
    --warn:#F0B24A; --warn-soft:rgba(240,178,74,.14); --danger:#FF6B52;
    --lcd:#0A100B; --lcd-ink:#86F2AE; --lcd-ghost:rgba(134,242,174,.07); --lcd-label:#6C9C7E; --lcd-line:rgba(134,242,174,.14);
    --bezel:#2C3135; --tab:rgba(18,20,22,.86);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Barlow,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:540px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 104px)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.top h1{margin:0;font:600 30px/1.1 'Barlow Semi Condensed',Barlow,sans-serif;letter-spacing:-.2px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:active{background:var(--fill)}
.icon-btn svg{width:24px;height:24px}

/* years */
.years{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 18px;padding:2px 16px}
.years::-webkit-scrollbar{display:none}
.year{flex:none;font:600 18px/1 'Barlow Semi Condensed',Barlow,sans-serif;padding:9px 16px;border-radius:999px;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.year[aria-selected="true"]{background:var(--ink);color:var(--bg);box-shadow:none}

/* pump display */
.pump{background:var(--lcd);color:var(--lcd-ink);border-radius:16px;padding:14px 18px 14px;margin:5px;box-shadow:0 0 0 5px var(--bezel),inset 0 2px 8px rgba(0,0,0,.14)}
.pump-label{font:500 15px/1.2 Barlow,sans-serif;color:var(--lcd-label)}
.pump-big{display:flex;align-items:flex-end;justify-content:flex-end;gap:8px;margin:6px 0 12px}
.pump-unit{font:600 26px/1 Barlow,sans-serif;color:var(--lcd-ink);padding-bottom:4px}
.pump-sub{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--lcd-line);padding-top:10px}
.pump-sub>div+div{border-left:1px solid var(--lcd-line);padding-left:14px}
.pump-sub .seg{font-size:22px;margin-top:6px}
.pump-sub .pump-val{display:flex;align-items:baseline;gap:6px}
.pump-sub .pump-u{font:500 14px Barlow,sans-serif;color:var(--lcd-label)}
.seg{position:relative;display:inline-block;font-family:DSEG7;font-weight:700;line-height:1;white-space:pre;letter-spacing:.02em}
.seg .g{color:var(--lcd-ghost)}
.seg .v{position:absolute;right:0;top:0;color:var(--lcd-ink)}
.seg.big{font-size:clamp(38px,12.8vw,58px)}

/* banners */
.note{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:13px 14px;margin:16px 0 0;font-size:15px;color:var(--ink-2)}
.note b{color:var(--ink);font-weight:600}
.note .note-act{margin-top:8px;font-weight:600;color:var(--accent)}
.note.warn{background:var(--warn-soft)}
.note svg{flex:none;width:22px;height:22px;color:var(--warn);margin-top:1px}

/* grouped list */
h2.sec{font:600 21px/1.2 'Barlow Semi Condensed',Barlow,sans-serif;margin:30px 4px 10px}
.group{background:var(--surface);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:52px;position:relative}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--hair)}
.row .k{color:var(--ink-2);font-size:16px}
.row .v{flex:none}
.row .v{text-align:right;font-weight:600;font-size:18px}
.row .v small{display:block;font-weight:400;font-size:14px;color:var(--ink-2)}
.row .v.good small{color:var(--accent)}
.foot{font-size:14px;color:var(--ink-3);margin:8px 6px 0}

button.row{width:100%;text-align:left}
button.row:active{background:var(--fill)}
.chev{width:18px;height:18px;color:var(--ink-3);transition:transform .25s}
[aria-expanded="true"] .chev{transform:rotate(90deg)}
.expand-title{font-weight:600;font-size:18px}
.expand-sub{display:block;font-size:14px;color:var(--ink-2)}

/* chart */
.chart-wrap{padding:14px 12px 6px}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--hair);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .axis{font:500 11px Barlow,sans-serif;fill:var(--ink-3)}
.chart .axis.on{fill:var(--ink);font-weight:600}
.chart .bar{fill:var(--bar-dim)}
.chart .bar.sel{fill:var(--bar)}
.chart .lbl{font:600 13px Barlow,sans-serif;fill:var(--ink)}
.chart .hit{fill:transparent;cursor:pointer}

/* month rows */
.mrow{display:block;width:100%;text-align:left;padding:11px 16px 12px;position:relative}
.mrow+.mrow::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--hair)}
.mrow:active{background:var(--fill)}
.mrow.sel{background:var(--accent-soft)}
.mrow-top{display:flex;justify-content:space-between;align-items:baseline}
.mrow-name{font-weight:500;font-size:17px;text-transform:capitalize}
.mrow-amt{font-weight:600;font-size:18px}
.mrow-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:3px;font-size:14px;color:var(--ink-2)}
.mrow-grid span:nth-child(n+2){text-align:right}
.mrow-more{font-size:13px;color:var(--accent);font-weight:600;margin-top:6px}
.mrow.empty .mrow-name,.mrow.empty .mrow-amt{color:var(--ink-3)}

/* years compare */
.yrow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;position:relative}
.yrow+.yrow::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--hair)}
.yrow:active{background:var(--fill)}
.yrow-y{font:600 19px 'Barlow Semi Condensed',Barlow,sans-serif}
.yrow-track{height:10px;border-radius:5px;background:var(--fill);overflow:hidden}
.yrow-bar{height:100%;border-radius:5px;background:var(--bar-dim)}
.yrow.cur .yrow-bar{background:var(--bar)}
.yrow-amt{font-weight:600;font-size:17px;text-align:right}
.yrow-meta{grid-column:2/4;display:flex;gap:16px;font-size:14px;color:var(--ink-2);margin-top:-4px}

/* list */

  form.mode = mode;
  document.querySelectorAll('.segctl button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.mode === mode)));
  $('#row-p').hidden = mode !== 'price';
  $('#row-t').hidden = mode !== 'total';
  if (mode === 'total') { $('#f-t').value = L > 0 && P > 0 ? inputNum(L * P, 2) : ''; }
  else { $('#f-p').value = P > 0 ? inputNum(P, 3) : ''; form.origPriceStr = null; }
  updateForm(); updatePriceHint();
}
function formError(msg) { const e = $('#f-err'); e.textContent = msg; e.hidden = false; e.scrollIntoView({block: 'center', behavior: 'smooth'}); }
function saveForm() {
  if (!form) return;
  $('#f-err').hidden = true;
  const date = $('#f-date').value;
  if (!date) return formError('Inserisci la data del rifornimento.');
  if (date > today()) return formError('La data non può essere nel futuro.');
  const km = parseInt($('#f-km').value.replace(/\D/g, ''), 10);
  if (!(km > 0)) return formError('Inserisci i km del contachilometri.');
  const {L, P} = formValues();
  if (!(L > 0 && L < 200)) return formError('Inserisci i litri, per esempio 40.');
  if (!(P > 0.5 && P < 5)) return formError(form.mode === 'price' ? 'Inserisci il prezzo al litro, per esempio 1,859.' : 'Inserisci l\'importo pagato, per esempio 75,00.');
  let before = null, after = null;
  for (const o of others()) {
    if (o.date === date && o.km === km) return formError('C\'è già un rifornimento con questa data e questi km.');
    if (o.date < date && (!before || o.km > before.km)) before = o;
    if (o.date > date && (!after || o.km < after.km)) after = o;
  }
  if (before && km <= before.km) return formError(`I km devono essere più di ${kmf(before.km)}, che avevi il ${dLong(before.date)}.`);
  if (after && km >= after.km) return formError(`I km devono essere meno di ${kmf(after.km)}, che avevi il ${dLong(after.date)}.`);
  const rec = {id: form.id || uid(), date, km, liters: Math.round(L * 1000) / 1000, price: P};
  if (form.est && form.mode === 'price') rec.est = true;
  if ($('#f-gap').checked) rec.gap = true;
  const i = store.refuels.findIndex(r => r.id === rec.id);
  const isNew = i < 0;
  if (isNew) store.refuels.push(rec); else store.refuels[i] = rec;
  persist(true);
  closeSheet();
  ui.year = +date.slice(0, 4); ui.selMonth = null;
  render();
  toast(isNew ? `Rifornimento salvato: ${eur(rec.liters * rec.price)}` : 'Modifiche salvate');
}
function deleteCurrent() {
  const i = store.refuels.findIndex(r => r.id === form.id);
  if (i < 0) return;
  const [gone] = store.refuels.splice(i, 1);
  persist(true); closeSheet(); render();
  toast('Rifornimento eliminato', 'Annulla', () => { store.refuels.push(gone); persist(true); render(); toast('Rifornimento ripristinato'); });
}

/* ---------- backup & data ---------- */
async function deliver(blob, name) {
  const file = new File([blob], name, {type: blob.type});
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file]}); return true; }
    catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}
async function doBackup() {
  const data = {app: 'benzina', version: 1, exported: new Date().toISOString(), refuels: store.refuels.slice().sort(byDate)};
  const blob = new Blob([JSON.stringify(data, null, 1)], {type: 'application/json'});
  const ok = await deliver(blob, `benzina-backup-${today()}.json`);
  if (ok) { store.lastBackup = new Date().toISOString(); persist(false); toast('Backup salvato'); render(); if (!sheet.hidden) openData(); }
}
async function doCsv() {
  const rows = derive();
  const c = (x, d) => x == null ? '' : x.toFixed(d).replace('.', ',');
  let out = '﻿Data;Contachilometri (km);Litri;Prezzo al litro (€);Importo (€);Prezzo medio nazionale;Km percorsi dal precedente;Km/l;Escluso dai consumi\r\n';
  for (const r of rows) out += [r.date.split('-').reverse().join('/'), r.km, c(r.liters, 2), c(r.price, 3), c(r.cost, 2), r.est ? 'sì' : 'no', r.since == null ? '' : r.since, c(r.sinceKml, 1), r.gap ? 'sì' : 'no'].join(';') + '\r\n';
  await deliver(new Blob([out], {type: 'text/csv'}), `benzina-rifornimenti-${today()}.csv`);
}
function importFile(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let list;
    try { const d = JSON.parse(fr.result); list = Array.isArray(d) ? d : d.refuels; } catch (e) { list = null; }
    if (!Array.isArray(list)) return toast('Il file non è un backup di Benzina.');
    let added = 0, upd = 0, dup = 0, bad = 0;
    const byKey = new Map(store.refuels.map(r => [r.date + '|' + r.km, r]));
    const ids = new Set(store.refuels.map(r => r.id));
    const sig = r => [r.liters, r.price, !!r.est, !!r.gap].join('|');
    for (const raw of list) {
      const r = clean(raw);
      if (!r) { bad++; continue; }
      const k = r.date + '|' + r.km, ex = byKey.get(k);
      if (ex) {
        if (sig(ex) === sig(r)) { dup++; continue; }
        ex.liters = r.liters; ex.price = r.price;
        if (r.est) ex.est = true; else delete ex.est;
        if (r.gap) ex.gap = true; else delete ex.gap;
        upd++; continue;
      }
      if (ids.has(r.id)) r.id = uid();
      byKey.set(k, r); ids.add(r.id); store.refuels.push(r); added++;
    }
    if (added || upd) persist(true);
    ui.year = null; ui.animated = null;
    if (!sheet.hidden) closeSheet();
    render();
    let msg = added ? `Importati ${added} rifornimenti` : 'Nessun rifornimento nuovo';
    if (upd) msg += `, ${upd} aggiornati`;
    if (dup) msg += `, ${dup} già presenti`;
    if (bad) msg += `, ${bad} non validi`;
    toast(msg);
  };
  fr.readAsText(file);
}
$('#file-in').addEventListener('change', e => { const f = e.target.files[0]; if (f) importFile(f); e.target.value = ''; });
function openData() {
  const days = store.lastBackup ? Math.floor((Date.now() - Date.parse(store.lastBackup)) / 864e5) : null;
  const last = AVG[AVG.length - 1];
  const html = `
  <p class="p">I rifornimenti sono salvati <b>solo su questo iPhone</b>. Ogni tanto salva un backup su iCloud Drive: se cambi telefono o cancelli l'app, lo ripristini da qui.</p>
  <div class="group" style="margin-top:16px">
    <div class="row"><span class="k">Rifornimenti salvati</span><span class="v">${store.refuels.length}</span></div>
    <div class="row"><span class="k">Ultimo backup</span><span class="v">${days == null ? 'mai' : days === 0 ? 'oggi' : days === 1 ? 'ieri' : days + ' giorni fa'}</span></div>
  </div>
  <button class="btn primary" type="button" id="d-backup">Salva backup</button>
  <button class="btn plain" type="button" id="d-import">Ripristina da backup</button>
  <button class="btn plain" type="button" id="d-csv">Esporta per Excel</button>
  <p class="hint">Il ripristino aggiunge i rifornimenti del file a quelli già presenti, senza duplicarli. Se un rifornimento c'è già (stessa data e stessi km), prende i valori del file.</p>
  <h2 class="sec">Prezzi medi</h2>
  <p class="p">Quando inserisci un rifornimento passato, il prezzo viene proposto dalla media nazionale settimanale della benzina pubblicata dal Ministero, dal ${dLong(AVG_BASE)} al ${dLong(new Date(last.t).toISOString().slice(0, 10))}. Per i rifornimenti più recenti scrivi il prezzo della pompa.</p>
  <button class="btn danger" type="button" id="d-wipe" style="margin-top:28px">Elimina tutti i rifornimenti</button>
  <p class="small">Benzina 1.1</p>`;
  openSheet('Backup e dati', html, 'Fine', closeSheet);
  sheet.querySelector('.sheet-head .link[data-close]').style.visibility = 'hidden';
  $('#d-backup').onclick = doBackup;
  $('#d-import').onclick = () => $('#file-in').click();
  $('#d-csv').onclick = doCsv;
  $('#d-wipe').onclick = () => {
    if (!store.refuels.length) return toast('Non ci sono rifornimenti da eliminare.');
    if (confirm(`Eliminare tutti i ${store.refuels.length} rifornimenti da questo iPhone? Non si può annullare: fai prima un backup.`)) {
      store.refuels = []; persist(true); closeSheet(); ui.year = null; render(); toast('Tutti i rifornimenti eliminati');
    }
  };
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, btnLabel, btnFn) {
  const t = $('#toast'), b = $('#toast-btn');
  $('#toast-msg').textContent = msg;
  b.hidden = !btnLabel; b.textContent = btnLabel || '';
  b.onclick = btnLabel ? () => { t.classList.remove('show'); btnFn(); } : null;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), btnLabel ? 5000 : 2600);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-nav],[data-year],[data-act],[data-month],[data-mrow],[data-id],#b-add,#b-data');
  if (!el || sheet.contains(el)) return;
  if (el.id === 'b-add') return openForm(null);
  if (el.id === 'b-data') return openData();
  if (el.dataset.nav) { ui.view = el.dataset.nav; render(); window.scrollTo(0, 0); return; }
  if (el.dataset.year) { ui.year = +el.dataset.year; ui.selMonth = null; render(); if (el.classList.contains('yrow')) window.scrollTo({top: 0, behavior: 'smooth'}); return; }
  if (el.dataset.month != null && el.dataset.month !== '') { ui.selMonth = +el.dataset.month; render(); return; }
  if (el.dataset.mrow != null) {
    const m = +el.dataset.mrow;
    if (ui.selMonth === m) { // second tap: open that month in the list
      ui.view = 'list'; render();
      const target = document.getElementById(`m-${ui.year}-${pad(m + 1)}`);
      if (target) target.scrollIntoView({block: 'start'});
      return;
    }
    ui.selMonth = m; render(); return;
  }
  if (el.dataset.id) return openForm(el.dataset.id);
  const act = el.dataset.act;
  if (act === 'add') openForm(null);
  else if (act === 'import') $('#file-in').click();
  else if (act === 'backup') doBackup();
  else if (act === 'months') { ui.monthsOpen = !ui.monthsOpen; render(); }
});

/* ---------- start ---------- */
load();
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
